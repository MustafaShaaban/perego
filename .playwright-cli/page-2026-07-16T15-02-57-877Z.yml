            - heading "من نحن" [level=2] [ref=e60]
            - paragraph [ref=e61]: بيريجو وكالة إبداعية رائدة متخصصة في الإعلان والإنتاج الرقمي، تخدم قاعدة عملاء متنوعة في جميع أنحاء المنطقة العربية. نقدم مجموعة واسعة من الخدمات المبتكرة، تشمل تصميم الهوية التجارية، والموشن جرافيك مع تطوير كامل للستوري بورد، وحلول متنوعة لمونتاج الفيديو، وغير ذلك الكثير — كل ذلك مصمم للارتقاء بأعمالك أو حضورك الرقمي.
